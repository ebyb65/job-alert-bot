name: Daily Job Search Agent

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Asia/Riyadh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-job-search-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run multi-source matcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python runner.py
      - name: Persist duplicate history
        if: always()
        run: |
          if git diff --quiet -- sent_jobs.json; then exit 0; fi
          git config user.name "job-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_jobs.json
          git commit -m "chore: update job history [skip ci]"
          git push
