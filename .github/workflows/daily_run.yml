name: Daily LinkedIn Job Alert

on:
  schedule:
    # 07:00 AM UTC = 10:00 AM Saudi Arabia Time
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-job-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai beautifulsoup4 requests python-telegram-bot python-docx

      - name: Run Job Alert Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
