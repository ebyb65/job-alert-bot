name: Daily HR Job Search

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Asia/Riyadh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-hr-job-search
  cancel-in-progress: false

jobs:
  run-job-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run multi-source job search and ATS matching
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_SOURCES: 'linkedin,indeed,naukrigulf,bayt,gulftalent'
          MIN_MATCH_SCORE: '78'
          HISTORY_LOOKBACK_DAYS: '30'
          MAX_JOBS: '50'
        run: python runner.py

      - name: Persist duplicate history
        if: always()
        run: |
          if git diff --quiet -- sent_jobs.json; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "job-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_jobs.json
          git commit -m "chore: update job alert history [skip ci]"
          git push
